events {
  worker_connections 2048;
}

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  charset utf-8;

  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main buffer=16k flush=5s;
  error_log /var/log/nginx/error.log warn;

  # /auth/ is split by route with two maps that yield an EMPTY key (= not
  # counted, nginx skips limit_req for empty keys) for the other class:
  #  - auth_zone (strict): the brute-force targets, 5r/m per IP.
  #  - auth_session_zone (generous): refresh, logout, client-cert-login and
  #    "me"-like routes. /auth/refresh runs on every page load, so it must
  #    never share the 5r/m bucket or a few reloads lock users out.
  map $uri $auth_strict_key {
    default "";
    "~*^/auth/(request-otp|verify-otp|verify-totp|setup-totp|confirm-totp)/?$" $binary_remote_addr;
  }
  map $uri $auth_session_key {
    default $binary_remote_addr;
    "~*^/auth/(request-otp|verify-otp|verify-totp|setup-totp|confirm-totp)/?$" "";
  }
  limit_req_zone $auth_strict_key zone=auth_zone:20m rate=5r/m;
  limit_req_zone $auth_session_key zone=auth_session_zone:20m rate=60r/m;
  # Per-IP safety net only. One canvas page load fires ~20 parallel requests
  # and several users share one hospital NAT address, so 600r/m with burst 200
  # is never reached by normal use; the per-user backend limit (apiRateLimit)
  # is the primary control.
  limit_req_zone $binary_remote_addr zone=api_zone:50m rate=600r/m;
  limit_req_zone $binary_remote_addr zone=static_zone:10m rate=200r/m;
  limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

  upstream backend { server backend:3000; keepalive 32; }
  upstream frontend { server frontend:8080; keepalive 16; }

  # $ssl_client_verify is only "SUCCESS" when the presented cert chains to
  # ssl_trusted_certificate's CA. This stack's client certs are individually
  # self-signed leaf certs with no shared CA (see docs/DEPLOYMENT.md's
  # "Onboarding sites in bulk" section), so nginx reports e.g.
  # "FAILED:self-signed certificate" for every one of them even though the
  # handshake itself completes under optional_no_ca - real verification is
  # deferred to the backend's fingerprint/thumbprint lookup. Admit exactly
  # the same FAILED: reasons the Apache reproduction in docs/DEPLOYMENT.md
  # already documents as safe (self-signed, unknown issuer), never expired
  # or revoked.
  map $ssl_client_verify $client_cert_verify {
    default                             $ssl_client_verify;
    "~^FAILED:(self.signed|unable to )" SUCCESS;
  }

  server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Cert-auth variant: the client certificate is requested and forwarded to
    # the backend, which matches its thumbprint against the allow-list
    # (organizations.client_cert_thumbprint). optional_no_ca lets the self-signed
    # DSF leaf certs complete the handshake; the thumbprint match is the gate.
    # ssl_trusted_certificate, not ssl_client_certificate: the latter sends the
    # client CA as the only acceptable issuer, and Java clients such as the DSF
    # BPE then present no certificate at all when their DSF certificate comes
    # from another CA. An empty issuer list lets every client offer its cert.
    ssl_trusted_certificate /etc/nginx/certs/client-ca.crt;
    ssl_verify_client      optional_no_ca;

    limit_conn conn_zone 20;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Cert-auth variant: the OTP/TOTP login endpoints are disabled. A regex
    # location (case-insensitive, optional trailing slash) is used so variants
    # like /auth/verify-otp/ or differing case cannot fall through to the
    # /auth/ prefix below and reach the backend. A matching regex location
    # outranks the /auth/ prefix; the non-OTP /auth routes (client-cert-login,
    # refresh, logout, me) do not match and stay reachable.
    location ~* ^/auth/(request-otp|verify-otp|verify-totp|setup-totp|confirm-totp)/?$ {
      return 403;
    }

    location /auth/ {
      limit_req zone=auth_zone burst=5 nodelay;
      limit_req zone=auth_session_zone burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_set_header X-Client-Verify $client_cert_verify;
      proxy_set_header X-Ssl-Client-Cert "";
      # Optional: certs/proxy-auth.conf holding `proxy_set_header X-Proxy-Auth "<CLIENT_CERT_PROXY_SECRET>";`
      include /etc/nginx/certs/proxy-auth.conf*;
      client_max_body_size 10k;
    }

    location /api/ {
      limit_req zone=api_zone burst=200 nodelay;
      limit_req_status 429;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_set_header X-Client-Verify $client_cert_verify;
      proxy_set_header X-Ssl-Client-Cert "";
      # Optional: certs/proxy-auth.conf holding `proxy_set_header X-Proxy-Auth "<CLIENT_CERT_PROXY_SECRET>";`
      include /etc/nginx/certs/proxy-auth.conf*;
      client_max_body_size 5m;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location /fhir/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_set_header X-Client-Verify $client_cert_verify;
      proxy_set_header X-Ssl-Client-Cert "";
      # Optional: certs/proxy-auth.conf holding `proxy_set_header X-Proxy-Auth "<CLIENT_CERT_PROXY_SECRET>";`
      include /etc/nginx/certs/proxy-auth.conf*;
      client_max_body_size 1m;
    }

    location / {
      limit_req zone=static_zone burst=50 nodelay;
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Client-Cert "";
      proxy_set_header X-Client-Verify "";
      proxy_intercept_errors on;
      error_page 404 = /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2|woff|ttf)$ {
      proxy_pass http://frontend;
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /health {
      proxy_pass http://backend;
      proxy_set_header X-Client-Cert "";
      proxy_set_header X-Client-Verify "";
      access_log off;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
  }
}
