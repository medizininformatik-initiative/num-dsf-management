# Apache front for the DSF e2e harness. The first vhost mirrors the relevant
# part of the production vhost on dsf-management (docs/DEPLOYMENT.md, Apache
# in front): TLS with optional_no_ca, no CA name list, anti-spoofing header
# reset and the self-signed / unknown-issuer mapping to X-Client-Verify.
# The second vhost serves the same backend with a certificate from a CA the
# e2e BPE does not trust, standing in for Let's Encrypt in production.
ServerRoot "/usr/local/apache2"
Listen 443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule unixd_module modules/mod_unixd.so

User daemon
Group daemon
ServerName portal-e2e.example.de
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h \"%r\" %>s verify=%{SSL_CLIENT_VERIFY}x dn=\"%{SSL_CLIENT_S_DN}x\" hdr=%{X-Client-Verify}i" dsf
CustomLog /proc/self/fd/1 dsf

SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
SSLProtocol -all +TLSv1.2 +TLSv1.3

<VirtualHost *:443>
    ServerName allowlist.portal-e2e.example.de
    SSLEngine on
    SSLCertificateFile /certs/portal-server.crt
    SSLCertificateKeyFile /certs/portal-server.key
    SSLCertificateChainFile /certs/issuing-ca.crt

    SSLVerifyClient optional_no_ca
    SSLVerifyDepth 3
    SSLOptions +StdEnvVars +ExportCertData

    RequestHeader unset X-Client-Cert
    RequestHeader unset X-Client-Verify
    RequestHeader unset X-Ssl-Client-Cert
    RequestHeader set X-Client-Verify "SUCCESS" "expr=%{SSL:SSL_CLIENT_VERIFY} =~ /^(SUCCESS|GENEROUS|FAILED:(self.signed|unable to ))/"
    RequestHeader set X-Client-Cert "expr=%{escape:%{SSL:SSL_CLIENT_CERT}}" "expr=%{SSL:SSL_CLIENT_VERIFY} =~ /^(SUCCESS|GENEROUS|FAILED:(self.signed|unable to ))/"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /fhir/ http://backend:3000/fhir/
    ProxyPassReverse /fhir/ http://backend:3000/fhir/
</VirtualHost>

<VirtualHost *:443>
    ServerName untrusted.portal-e2e.example.de
    SSLEngine on
    SSLCertificateFile /certs/untrusted-server.crt
    SSLCertificateKeyFile /certs/untrusted-server.key

    SSLVerifyClient optional_no_ca
    SSLVerifyDepth 3
    SSLOptions +StdEnvVars +ExportCertData

    RequestHeader unset X-Client-Cert
    RequestHeader unset X-Client-Verify
    RequestHeader set X-Client-Verify "SUCCESS" "expr=%{SSL:SSL_CLIENT_VERIFY} =~ /^(SUCCESS|GENEROUS|FAILED:(self.signed|unable to ))/"
    RequestHeader set X-Client-Cert "expr=%{escape:%{SSL:SSL_CLIENT_CERT}}" "expr=%{SSL:SSL_CLIENT_VERIFY} =~ /^(SUCCESS|GENEROUS|FAILED:(self.signed|unable to ))/"

    ProxyPass /fhir/ http://backend:3000/fhir/
    ProxyPassReverse /fhir/ http://backend:3000/fhir/
</VirtualHost>
