# Publishes docs/wiki/ to the GitHub wiki of this repository.
# docs/wiki/ stays the source of truth (edited through pull requests); the
# wiki is a read-only copy. Links are rewritten for the wiki: sibling pages
# lose their .md suffix, links leaving docs/wiki/ point at the file on main.
# The wiki must exist once (create any first page in the browser).
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Copy pages and rewrite links
        env:
          BASE: https://github.com/${{ github.repository }}/blob/main
        run: |
          find wiki -maxdepth 1 -name '*.md' -delete
          for f in docs/wiki/*.md; do
            sed -E \
              -e "s#\]\(\.\./\.\./#](${BASE}/#g" \
              -e "s#\]\(\.\./#](${BASE}/docs/#g" \
              -e 's#\]\(([A-Za-z0-9_-]+)\.md(\#[^)]*)?\)#](\1\2)#g' \
              "$f" > "wiki/$(basename "$f")"
          done
          printf 'Source: [`docs/wiki/`](%s/docs/wiki) — changes go through pull requests there.\n' "${BASE}" > wiki/_Footer.md

      - name: Push to the wiki
        working-directory: wiki
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki already up to date.'
            exit 0
          fi
          git commit -m "docs: sync wiki from ${GITHUB_SHA::7}"
          git push
