name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Backend audit
        working-directory: backend
        run: |
          npm ci
          # Excluded advisories have no fix inside the current major and are not
          # reachable from this code base:
          #  - GHSA-mrhx-c7xc-m3w5: zod memory exhaustion on oversized constrained
          #    collections. Every validated input is size-capped before zod sees it (JSON
          #    bodies 100 kB, onboarding files 1 MB and 1000 rows). The fix is zod 3 -> 4
          #    (semver-major); Dependabot owns it.
          npx better-npm-audit audit --level high -x GHSA-mrhx-c7xc-m3w5
      - name: Frontend audit
        working-directory: frontend
        run: |
          npm ci
          # Excluded advisories are all in BUILD-TIME dev tooling (vitest/vite/esbuild),
          # never shipped in the production bundle and not reachable at app runtime:
          #  - GHSA-5xrq-8626-4rwp: vitest --ui server, which CI never starts (vitest run only).
          #  - GHSA-fx2h-pf6j-xcff: vite dev-server `server.fs.deny` bypass, only reachable
          #    when the dev server is bound to the network via --host. Production serves the
          #    static `vite build` output through nginx and never starts the dev server. The
          #    only fix is vite 5 -> 8 (semver-major, cascading vitest 1 -> 4); Dependabot owns it.
          #  - GHSA-587h-7wmj-h5pm: launch-editor existence check in the vite dev server's
          #    open-in-editor middleware; dev server only, fix is vite 5 -> 8 (see above).
          #  - GHSA-mrhx-c7xc-m3w5: zod memory exhaustion on oversized collections. In the
          #    browser zod only validates the user's own form input; fix is zod 3 -> 4.
          #  - GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr: tinypool prototype-pollution gadgets in
          #    its worker pool. tinypool is vitest's test-runner pool and only ever runs this
          #    repository's own test files; it is not part of the build output. The fix
          #    (tinypool 2.1.2) needs vitest 1 -> 4 (semver-major); Dependabot owns it.
          npx better-npm-audit audit --level high -x GHSA-5xrq-8626-4rwp,GHSA-fx2h-pf6j-xcff,GHSA-5gmw-xhrv-c9v3,GHSA-85c8-ppgw-ccpr,GHSA-587h-7wmj-h5pm,GHSA-mrhx-c7xc-m3w5

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: dsf_allowlist
          MYSQL_USER: dsf
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: dsf_allowlist
      DB_USER: dsf
      DB_PASSWORD: testpass
      DB_ROOT_PASSWORD: testroot
      REDIS_URL: redis://localhost:6379
      # 64 hex chars = 32 bytes, required by AES-256-GCM in totp.service.
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      DSF_ENVIRONMENT: TEST
      IMI_ADMIN_EMAILS: admin@test.de
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - name: Run database migrations
        run: |
          for f in ../db/migrations/*.sql; do
            echo "Applying $f"
            mysql -h 127.0.0.1 -u root -ptestroot dsf_allowlist < "$f"
          done
      - name: Generate test JWT keys
        run: |
          openssl genrsa 2048 > /tmp/jwt_private.pem
          openssl rsa -in /tmp/jwt_private.pem -pubout > /tmp/jwt_public.pem
          echo "JWT_PRIVATE_KEY_BASE64=$(base64 -w0 /tmp/jwt_private.pem)" >> $GITHUB_ENV
          echo "JWT_PUBLIC_KEY_BASE64=$(base64 -w0 /tmp/jwt_public.pem)" >> $GITHUB_ENV
      - run: npm run test:coverage

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test:coverage

  frontend-e2e:
    needs: frontend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Setup .env from example
        run: |
          cp .env.example .env || true
          grep -q "DEV_AUTO_LOGIN=true" .env || echo "DEV_AUTO_LOGIN=true" >> .env
          grep -q "DEV_TOTP_BYPASS=true" .env || echo "DEV_TOTP_BYPASS=true" >> .env
          # Every spec signs in as the same dev admin; the whole suite exceeds
          # the 100/min per-user API limit and turns into random 429s.
          sed -i '/^RATE_LIMIT_API_MAX=/d' .env
          echo "RATE_LIMIT_API_MAX=10000" >> .env
          # backend/src/index.ts hard-aborts when DEV_TOTP_BYPASS=true unless
          # NODE_ENV=development AND HOST is localhost. CI satisfies both.
          grep -q "^NODE_ENV=" .env || echo "NODE_ENV=development" >> .env
          grep -q "^HOST=" .env || echo "HOST=127.0.0.1" >> .env
          sed -i 's|^IMI_ADMIN_EMAILS=.*|IMI_ADMIN_EMAILS=admin@imi-test.example.de|' .env
      - name: Generate dev keys
        run: |
          if [ -f scripts/generate-keys.sh ]; then bash scripts/generate-keys.sh; fi
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Generate TLS certs
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout certs/server.key -out certs/server.crt \
            -subj "/CN=localhost" 2>/dev/null
          cp certs/server.crt certs/client-ca.crt
      - name: Disable nginx rate limits for CI
        run: sed -i '/limit_req/d' nginx/nginx.conf
      - name: Start docker stack
        run: |
          # The ts-node-dev backend can occasionally exceed its healthcheck
          # window on a cold CI runner. Retry once, and dump backend logs on
          # failure so a real problem (not just a slow start) is diagnosable.
          for attempt in 1 2; do
            if docker compose up -d --wait; then exit 0; fi
            echo "::warning::stack not healthy on attempt ${attempt}; backend logs:"
            docker compose logs --tail=150 backend || true
            docker compose down -v || true
          done
          echo "::error::docker stack failed to become healthy after 2 attempts"
          exit 1
      - name: Apply migrations
        run: |
          DB_PW=$(grep ^DB_PASSWORD .env | cut -d= -f2)
          for f in db/migrations/*.sql; do
            docker compose exec -T db mysql -udsf -p"$DB_PW" dsf_allowlist < "$f" 2>&1 | tail -1 || true
          done
      - name: Seed
        run: docker compose exec -T backend npx ts-node src/db/seed-testdata.ts
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  frontend-contract:
    needs: frontend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Setup .env from example
        run: |
          cp .env.example .env || true
          grep -q "DEV_AUTO_LOGIN=true" .env || echo "DEV_AUTO_LOGIN=true" >> .env
          grep -q "DEV_TOTP_BYPASS=true" .env || echo "DEV_TOTP_BYPASS=true" >> .env
          # Every spec signs in as the same dev admin; the whole suite exceeds
          # the 100/min per-user API limit and turns into random 429s.
          sed -i '/^RATE_LIMIT_API_MAX=/d' .env
          echo "RATE_LIMIT_API_MAX=10000" >> .env
          # backend/src/index.ts hard-aborts when DEV_TOTP_BYPASS=true unless
          # NODE_ENV=development AND HOST is localhost. CI satisfies both.
          grep -q "^NODE_ENV=" .env || echo "NODE_ENV=development" >> .env
          grep -q "^HOST=" .env || echo "HOST=127.0.0.1" >> .env
          sed -i 's|^IMI_ADMIN_EMAILS=.*|IMI_ADMIN_EMAILS=admin@imi-test.example.de|' .env
      - name: Generate dev keys
        run: |
          if [ -f scripts/generate-keys.sh ]; then bash scripts/generate-keys.sh; fi
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Generate TLS certs
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout certs/server.key -out certs/server.crt \
            -subj "/CN=localhost" 2>/dev/null
          cp certs/server.crt certs/client-ca.crt
      - name: Disable nginx rate limits for CI
        run: sed -i '/limit_req/d' nginx/nginx.conf
      - name: Start docker stack
        run: |
          # The ts-node-dev backend can occasionally exceed its healthcheck
          # window on a cold CI runner. Retry once, and dump backend logs on
          # failure so a real problem (not just a slow start) is diagnosable.
          for attempt in 1 2; do
            if docker compose up -d --wait; then exit 0; fi
            echo "::warning::stack not healthy on attempt ${attempt}; backend logs:"
            docker compose logs --tail=150 backend || true
            docker compose down -v || true
          done
          echo "::error::docker stack failed to become healthy after 2 attempts"
          exit 1
      - name: Apply migrations
        run: |
          DB_PW=$(grep ^DB_PASSWORD .env | cut -d= -f2)
          for f in db/migrations/*.sql; do
            docker compose exec -T db mysql -udsf -p"$DB_PW" dsf_allowlist < "$f" 2>&1 | tail -1 || true
          done
      - name: Seed
        run: docker compose exec -T backend npx ts-node src/db/seed-testdata.ts
      - name: Run contract suite
        working-directory: frontend
        env:
          CONTRACT_BASE_URL: http://localhost
        run: npm run test:contract

  frontend-bundle:
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npx vite build
      - run: npx bundlesize --config .bundlesize.json

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: npx prettier --check .

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Findings are in the job log; the SARIF artifact only used up the
          # Actions storage quota (an upload failure failed a clean scan).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  build:
    name: Docker Image (build + downloadable bundle)
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - backend-lint
      - frontend-test
      - frontend-lint
      - frontend-e2e
      - frontend-contract
      - frontend-bundle
      - security-audit
      - secret-scan
      - format
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - name: Compute tags
        run: |
          echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Build production images
        run: |
          REPO="ghcr.io/${OWNER_LC}/dsf-allowlist"
          docker build --target prod -t "${REPO}-backend:${SHA}" -f backend/Dockerfile backend/
          docker build --target prod --build-arg VITE_API_URL=/api/v1 \
            -t "${REPO}-frontend:${SHA}" -f frontend/Dockerfile frontend/
      - name: Export downloadable image bundle
        run: |
          REPO="ghcr.io/${OWNER_LC}/dsf-allowlist"
          docker save "${REPO}-backend:${SHA}" "${REPO}-frontend:${SHA}" \
            | gzip > "dsf-allowlist-images-${SHA}.tar.gz"
          sha256sum "dsf-allowlist-images-${SHA}.tar.gz" > "dsf-allowlist-images-${SHA}.tar.gz.sha256"
      - name: Smoke-test the bundle re-loads
        run: |
          REPO="ghcr.io/${OWNER_LC}/dsf-allowlist"
          docker image rm -f "${REPO}-backend:${SHA}" "${REPO}-frontend:${SHA}"
          gunzip -c "dsf-allowlist-images-${SHA}.tar.gz" | docker load
          docker image inspect "${REPO}-backend:${SHA}" >/dev/null
          docker image inspect "${REPO}-frontend:${SHA}" >/dev/null
      - name: Upload image bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsf-allowlist-images-${{ env.SHA }}
          path: |
            dsf-allowlist-images-${{ env.SHA }}.tar.gz
            dsf-allowlist-images-${{ env.SHA }}.tar.gz.sha256
          # One image bundle per push to main; 30 days filled the storage quota.
          retention-days: 7
          if-no-files-found: error
