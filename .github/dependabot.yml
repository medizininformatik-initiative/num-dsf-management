version: 2
# Minor and patch updates arrive grouped, one pull request per directory.
# Major updates arrive one pull request per package, so each breaking change
# is reviewed and reverted on its own. Security updates are separate anyway.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    groups:
      backend-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    groups:
      frontend-dependencies:
        update-types: [minor, patch]
    # React 18 and React Router v6 are fixed by the stack decision; moving
    # them is a planned migration, not a dependency update.
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'

  # Base images of the Dockerfiles (nginx, node).
  - package-ecosystem: docker
    directories: [/backend, /frontend, /nginx]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      docker-images:
        update-types: [minor, patch]

  # image: lines of the compose files (release run kit, DSF e2e stack).
  - package-ecosystem: docker-compose
    directories: [/, /scripts/dsf-e2e]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      compose-images:
        update-types: [minor, patch]
