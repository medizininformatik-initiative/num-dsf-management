version: 2
# Version updates cover minor and patch releases only, grouped into one pull
# request per directory. Major releases are migrations and are planned by hand
# (npm outdated, release notes). Security alerts, npm audit and dependency
# review in CI still report vulnerable packages of any version.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    groups:
      backend-dependencies:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    groups:
      frontend-dependencies:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'

  # Base images of the Dockerfiles (nginx, node).
  - package-ecosystem: docker
    directories: [/backend, /frontend, /nginx]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      docker-images:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # image: lines of the compose files (release run kit, DSF e2e stack).
  - package-ecosystem: docker-compose
    directories: [/, /scripts/dsf-e2e]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      compose-images:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
