# Certificate-auth deployment variant (login-screen-free). See ADR-005 and
# docs/DEPLOYMENT.md. Differs from docker-compose.prod.yml only in: nginx mounts
# nginx.cert-auth.conf, and the frontend is built with VITE_AUTH_MODE=cert.

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    ports:
      - '80:8080'
      - '443:8443'
    volumes:
      - ./nginx/nginx.cert-auth.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api/v1
        VITE_AUTH_MODE: cert
        VITE_DSF_ENVIRONMENT: ${DSF_ENVIRONMENT:-PRODUCTION}
    restart: always
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  backend:
    build:
      context: ./backend
      target: prod
    env_file: .env.prod
    environment:
      NODE_ENV: production
      # Certificate-only backend: OTP/TOTP routes answer 403, every session is
      # bound to the presented client certificate on each request.
      AUTH_MODE: cert
    volumes:
      # Application backups (JSON dumps written by the backend). A named volume,
      # no published port; copy files off the host with docker cp / the admin page.
      - backup-data:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/health/ready',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    networks:
      - frontend-net
      - backend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  db:
    image: mysql:8.0
    platform: linux/amd64
    # log-bin-trust-function-creators lets the trigger-creating migrations (013,
    # 015) apply cleanly; mirrors docker-compose.yml (dev).
    command:
      - --log-bin-trust-function-creators=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # Mount the migrations so a fresh data volume self-initializes the full
      # schema on first boot. Init scripts run once, in filename order, only
      # while the volume is empty; later migrations are applied manually.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Probe over TCP (127.0.0.1), not the Unix socket: during first-time init
      # the socket answers pings while TCP 3306 is still refused, so a socket
      # ping reports healthy before the backend can connect. Running all
      # migrations at init makes that window longer, so start_period is generous.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${DB_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: always
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  mysql-data:
  redis-data:
  backup-data:

networks:
  frontend-net:
  backend-net:
    internal: true
